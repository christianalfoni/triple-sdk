name = "workspaces"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[assets]
directory = "../console/dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
# Browser navigations hit the assets layer BEFORE the Worker, and the SPA
# fallback would answer /auth/login and /w/<ws>/apps/… with the console's
# index.html. These routes are the Worker's; everything else is a static file.
run_worker_first = ["/auth/*", "/api/*", "/w/*", "/mcp", "/.well-known/*"]

[[durable_objects.bindings]]
name = "CELL"
class_name = "WorkspaceCell"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceCell"]

# Auth config is deliberately NOT here: DEV_AUTH=1 lives in .dev.vars (local
# only, gitignored) so a deploy can never ship with the bypass on. Production
# gets WorkOS credentials via secrets:
#   wrangler secret put WORKOS_CLIENT_ID
#   wrangler secret put WORKOS_API_KEY
# With neither DEV_AUTH nor secrets set, every request 401s — failing safe.
